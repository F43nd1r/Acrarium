name: release-build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Test and build release
        uses: burrunan/gradle-cache-action@v3.0.3
        with:
          job-id: jdk21
          arguments: test bootJar bootWar
          properties: vaadin.productionMode=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: echo ::set-output name=value::$(git describe --abbrev=0 | sed -e "s/^v//")
      - name: Verify release assets
        run: |
          jar tf ./acrarium/build/libs/application.war | grep -qx 'WEB-INF/classes/com/faendir/acra/BackendApplicationKt.class'
          jar tf ./acrarium/build/libs/application.jar | grep -qx 'BOOT-INF/classes/com/faendir/acra/BackendApplicationKt.class'
          jar tf ./acrarium/build/libs/application.jar | grep -qx 'org/springframework/boot/loader/launch/JarLauncher.class'
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          draft: false
      - name: Upload Release War
        id: upload-release-asset-1
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./acrarium/build/libs/application.war
          asset_name: acrarium-${{ steps.version.outputs.value }}.war
          asset_content_type: application/zip
      - name: Upload Release Jar
        id: upload-release-asset-2
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./acrarium/build/libs/application.jar
          asset_name: acrarium-${{ steps.version.outputs.value }}.jar
          asset_content_type: application/zip
